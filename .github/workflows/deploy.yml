# Builds the site and uploads it as the "site" artifact. Site Change Agents, running next to the web
# server, waits for this run, downloads the artifact and publishes it:
#   Pull request -> <SITES_BASE_URL>/previews/<repo>/pr-<number>/
#   Merge to main -> <SITES_BASE_URL>/<repo>/
# Nothing reaches into the server: no SSH keys or open ports, so it works behind a tunnel or NAT.
# This file is the same in every test site; the site ID is the repository name.
#
# Repository (or organization) variable it needs: SITES_BASE_URL, e.g. https://sites.example.com

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_ID: ${{ github.event.repository.name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.target.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Choose the publish path
        id: target
        env:
          SITES_BASE_URL: ${{ vars.SITES_BASE_URL }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            path="previews/$SITE_ID/pr-$PR_NUMBER"
          else
            path="$SITE_ID"
          fi
          {
            echo "path=$path"
            echo "url=${SITES_BASE_URL%/}/$path/"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          SITE_BASE: /${{ steps.target.outputs.path }}/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        env:
          URL: ${{ steps.target.outputs.url }}
        run: echo "Built for **$URL** (published by Site Change Agents)" >> "$GITHUB_STEP_SUMMARY"
